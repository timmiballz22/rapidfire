<!doctype html><meta charset="utf-8"><title>Loading World Sandbox…</title><style>html,body{margin:0;background:#10131a;color:#fff;font:14px system-ui;height:100%}body{display:grid;place-items:center}</style><div id="s">Loading World Sandbox…</div><script>(async()=>{try{const parts=["part-01.txt","part-02.txt","part-03.txt","part-04.txt"];const base=new URL("world-sandbox-parts/",location.href);const text=(await Promise.all(parts.map(p=>fetch(new URL(p,base)).then(r=>{if(!r.ok)throw new Error(p+" "+r.status);return r.text()})))).join("");document.open();document.write(text);document.close()}catch(e){document.getElementById("s").textContent="World Sandbox failed to load: "+e.message;console.error(e)}})()</script>
