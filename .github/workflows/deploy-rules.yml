name: Deploy Firebase site and rules
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['firestore.rules', 'database.rules.json', 'firestore.indexes.json', 'firebase.json', '.firebaserc', 'index.html', 'js/**', 'projects/**', 'scripts/build.mjs', 'package.json', 'package-lock.json', '.github/workflows/deploy-rules.yml']
permissions:
  contents: read
  id-token: write
concurrency:
  group: firebase-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: firebase-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Verify Firebase deployment identity
        env:
          WIF_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          DEPLOY_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$WIF_PROVIDER" ] || [ -z "$DEPLOY_ACCOUNT" ]; then
            echo "::error::Firebase deployment identity is missing from the firebase-production environment. Configure GCP_WORKLOAD_IDENTITY_PROVIDER and GCP_SERVICE_ACCOUNT."
            exit 1
          fi
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - run: npm ci
      - run: npx firebase deploy --project rapidfire-31bae --only hosting,firestore,database --non-interactive
      - name: Verify both Hosting domains serve RapidFire
        shell: bash
        run: |
          for origin in https://rapidfire-31bae.web.app https://rapidfire-31bae.firebaseapp.com; do
            curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 3 "$origin/index.html" -o /tmp/rapidfire-live.html
            cmp dist/index.html /tmp/rapidfire-live.html
            curl --fail --silent --show-error "$origin/projects/defaults/catalog.json" -o /tmp/rapidfire-catalog.json
            cmp dist/projects/defaults/catalog.json /tmp/rapidfire-catalog.json
          done
