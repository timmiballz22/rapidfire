name: Verify personalized recommendations
on:
  push:
    branches: [feature/personalized-feed-five-preload]
  pull_request:
    paths:
      - 'js/recommendations.js'
      - 'js/app.js'
      - 'js/firebase-service.js'
      - 'index.html'
      - 'firestore.rules'
      - 'tests/recommendations.*'
      - '.github/workflows/recommendations.yml'
permissions:
  contents: read
jobs:
  recommendations:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund
      - run: node scripts/sync-inline.mjs --check
      - run: node --check js/recommendations.js && node --check js/app.js && node --check js/firebase-service.js
      - run: node --test tests/recommendations.test.cjs
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/recommendations.spec.cjs
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: recommendations-smoke-evidence
          path: test-results/
